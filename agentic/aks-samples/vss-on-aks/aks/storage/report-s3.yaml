apiVersion: v1
kind: Service
metadata:
  name: vss-report-s3
  namespace: <NAMESPACE>
spec:
  selector:
    app: vss-report-s3
  ports:
    - name: s3
      port: 8333
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vss-report-s3
  namespace: <NAMESPACE>
spec:
  serviceName: vss-report-s3
  replicas: 1
  selector:
    matchLabels:
      app: vss-report-s3
  template:
    metadata:
      labels:
        app: vss-report-s3
    spec:
      containers:
        - name: s3
          image: chrislusf/seaweedfs:4.48
          args: ["mini", "-dir=/data", "-admin.port=12646"]
          ports:
            - name: s3
              containerPort: 8333
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: vss-report-s3
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: vss-report-s3
                  key: AWS_SECRET_ACCESS_KEY
            - name: S3_BUCKET
              value: vss-reports
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: managed-csi-premium
        resources:
          requests:
            storage: 5Gi
